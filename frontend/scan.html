<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f7f9">
  <title>Scan a skill · Red Flags</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/platform.css">
  <script src="config.js"></script>
</head>
<body class="platform">
  <!-- Flag shape used by the small icons. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="flag" viewBox="0 0 140 190">
      <rect x="8" y="6" width="6" height="180" rx="3" fill="#1d2939"/>
      <path d="M14 14 C 44 0, 76 30, 128 10 L 128 82 C 76 102, 44 74, 14 88 Z" fill="currentColor"/>
    </symbol>
  </svg>

  <header class="site-header">
    <a class="brand" href="index.html">
      <svg class="brand-flag" viewBox="0 0 140 190" aria-hidden="true"><use href="#flag"/></svg>
      Red Flags
    </a>
  </header>

  <main class="workspace">
    <!-- Left: the skill and the Scan button -->
    <section class="skill-panel" data-skill-panel aria-label="Skill to scan">
      <div class="panel-head">
        <h1 class="panel-title">Skill</h1>
        <button class="btn btn-ghost" type="button" data-clear>Clear</button>
      </div>

      <div class="segmented" role="tablist">
        <button class="seg is-active" role="tab" data-tab="paste" aria-selected="true">Paste code</button>
        <button class="seg" role="tab" data-tab="upload" aria-selected="false">Upload file</button>
        <button class="seg" role="tab" data-tab="github" aria-selected="false">GitHub repo</button>
      </div>

      <div class="tab-panel" data-panel="paste">
        <textarea data-text spellcheck="false" aria-label="Skill code" placeholder="Paste your SKILL.md file content here..."></textarea>
      </div>

      <div class="tab-panel" data-panel="upload" hidden>
        <label class="dropzone" data-dropzone>
          <input type="file" data-file accept=".md,.txt">
          <span data-file-label>Drop a .md or .txt file here, or click to choose one</span>
        </label>
      </div>

      <div class="tab-panel" data-panel="github" hidden>
        <input type="text" data-repo spellcheck="false" autocomplete="off" aria-label="GitHub repo" placeholder="https://github.com/user/repo or user/repo">
        <p class="hint">Public repos only. We scan the text files in the repo.</p>
      </div>

      <p class="notice-error" data-error role="alert" hidden></p>
      <p class="notice-info" data-info role="status" hidden></p>
      <button class="btn btn-scan" type="button" data-scan>Scan</button>
    </section>

    <!-- Right: result sections are added here by js/main.js -->
    <div class="results" id="results" aria-live="polite"></div>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
